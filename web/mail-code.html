<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>邮箱验证码查看</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, "Microsoft YaHei", Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 20% 20%, rgba(71, 118, 230, .18), transparent 32%), #f5f7fb;
    }
    .card {
      width: min(720px, 100%);
      background: rgba(255, 255, 255, .94);
      border: 1px solid rgba(108, 122, 145, .18);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(30, 50, 90, .14);
      padding: 28px;
    }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 4vw, 36px); }
    .subtitle { margin: 0 0 24px; color: #657089; line-height: 1.7; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3246a8;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .status.ok { background: #e8f8ef; color: #14713c; }
    .status.error { background: #fff0f0; color: #b42318; }
    .grid { display: grid; gap: 14px; }
    .field {
      border: 1px solid #e3e8f2;
      border-radius: 18px;
      padding: 16px;
      background: #fbfcff;
    }
    .label {
      display: block;
      color: #657089;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .value {
      min-height: 28px;
      word-break: break-all;
      font-size: 16px;
      font-weight: 650;
    }
    .code {
      font-size: clamp(44px, 12vw, 76px);
      letter-spacing: .14em;
      text-align: center;
      font-weight: 900;
      color: #111827;
      line-height: 1.1;
      padding: 12px 0;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 800;
      background: #335cff;
      color: white;
      min-height: 44px;
    }
    button.secondary { background: #edf1f8; color: #172033; }
    button:disabled { opacity: .55; cursor: wait; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #111827;
      color: #d1fae5;
      border-radius: 16px;
      padding: 14px;
      max-height: 260px;
      overflow: auto;
      font-size: 12px;
    }
    .hint { color: #657089; font-size: 13px; line-height: 1.7; margin-top: 14px; }
    @media (prefers-color-scheme: dark) {
      :root { background: #0b1020; color: #e5e7eb; }
      body { background: radial-gradient(circle at 20% 20%, rgba(80, 120, 255, .22), transparent 32%), #0b1020; }
      .card { background: rgba(17, 24, 39, .94); border-color: rgba(148, 163, 184, .2); }
      .subtitle, .label, .hint { color: #a8b3c7; }
      .field { background: #111827; border-color: #273244; }
      .code { color: #f9fafb; }
      button.secondary { background: #243044; color: #e5e7eb; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>邮箱验证码查看</h1>
    <p class="subtitle">打开此页面后会自动查询该邮箱 Token 对应的最新验证码。若验证码未出现，请确认目标网站已经发送邮件。</p>
    <div id="status" class="status">准备查询</div>
    <section class="grid">
      <div class="field">
        <span class="label">邮箱地址</span>
        <div id="email" class="value">-</div>
      </div>
      <div class="field">
        <span class="label">验证码</span>
        <div id="code" class="code">------</div>
      </div>
      <div class="field">
        <span class="label">查询信息</span>
        <div id="meta" class="value">-</div>
      </div>
    </section>
    <div class="actions">
      <button id="refreshBtn" type="button">重新查询</button>
      <button id="copyBtn" class="secondary" type="button" disabled>复制验证码</button>
    </div>
    <p class="hint">链接格式：/mail-code?token=邮箱Token。Token 等同于邮箱查看凭证，请只发送给对应邮箱使用者。</p>
    <pre id="raw" hidden></pre>
  </main>
  <script>
    const statusEl = document.querySelector("#status");
    const emailEl = document.querySelector("#email");
    const codeEl = document.querySelector("#code");
    const metaEl = document.querySelector("#meta");
    const rawEl = document.querySelector("#raw");
    const refreshBtn = document.querySelector("#refreshBtn");
    const copyBtn = document.querySelector("#copyBtn");
    let latestCode = "";

    function setStatus(text, type) {
      statusEl.textContent = text;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function tokenFromURL() {
      const params = new URLSearchParams(location.search);
      return (params.get("token") || params.get("t") || "").trim();
    }

    async function queryCode() {
      const token = tokenFromURL();
      latestCode = "";
      copyBtn.disabled = true;
      codeEl.textContent = "------";
      rawEl.hidden = true;
      if (!token) {
        setStatus("链接缺少 token", "error");
        metaEl.textContent = "请确认链接中包含 ?token=邮箱Token";
        return;
      }
      refreshBtn.disabled = true;
      setStatus("正在查询验证码...", "");
      metaEl.textContent = "请稍候，系统正在读取邮箱最新邮件";
      try {
        const response = await fetch("/api/luckmail/token-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ luckmail_token: token, timeout_s: 60, interval_s: 3 })
        });
        const data = await response.json();
        emailEl.textContent = data.email_address || "-";
        latestCode = data.verification_code || "";
        codeEl.textContent = latestCode || "------";
        metaEl.textContent = [data.project, data.has_new_mail ? "发现新邮件" : "暂未发现新邮件", data.elapsed_ms ? data.elapsed_ms + "ms" : ""].filter(Boolean).join(" · ") || (data.error || "-");
        rawEl.textContent = JSON.stringify(Object.assign({}, data, { verification_code: latestCode ? "已显示" : "" }), null, 2);
        rawEl.hidden = false;
        if (latestCode) {
          setStatus("已获取验证码", "ok");
          copyBtn.disabled = false;
        } else {
          setStatus(data.error || "暂未获取到验证码", data.ok ? "" : "error");
        }
      } catch (error) {
        setStatus("查询失败", "error");
        metaEl.textContent = error.message || "请求失败";
      } finally {
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener("click", queryCode);
    copyBtn.addEventListener("click", async function () {
      if (!latestCode) return;
      await navigator.clipboard.writeText(latestCode);
      setStatus("验证码已复制", "ok");
    });
    queryCode();
  </script>
</body>
</html>
