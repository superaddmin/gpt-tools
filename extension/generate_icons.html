<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>图标生成器 - ChatAdd</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h1 { color: #10a37f; font-size: 20px; }
    .preview { display: flex; gap: 20px; margin: 20px 0; align-items: center; }
    .preview canvas { border: 1px solid #333; border-radius: 8px; }
    button {
      padding: 10px 20px;
      background: #10a37f;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin: 4px;
    }
    button:hover { opacity: 0.85; }
    .note { font-size: 12px; color: #888; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>ChatAdd 图标生成器</h1>
  <p>点击下方按钮生成并下载各尺寸图标，放入 <code>extension/icons/</code> 目录</p>
  <div class="preview">
    <canvas id="c16" width="16" height="16"></canvas>
    <canvas id="c48" width="48" height="48"></canvas>
    <canvas id="c128" width="128" height="128"></canvas>
  </div>
  <div>
    <button onclick="downloadAll()">一键下载全部图标</button>
  </div>
  <p class="note">下载后请将 icon16.png / icon48.png / icon128.png 放入 extension/icons/ 目录</p>

  <script>
    /**
     * 在 Canvas 上绘制 ChatAdd 图标（钥匙 + 下载箭头组合）
     * @param {HTMLCanvasElement} canvas
     */
    function drawIcon(canvas) {
      var ctx = canvas.getContext('2d');
      var w = canvas.width;
      var h = canvas.height;
      var cx = w / 2;
      var cy = h / 2;
      var r = w * 0.42;

      ctx.clearRect(0, 0, w, h);

      // 背景圆
      var grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#10a37f');
      grad.addColorStop(1, '#0d8c6d');
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // 钥匙主体
      var keyW = w * 0.28;
      var keyH = w * 0.12;
      var keyX = cx - keyW / 2;
      var keyY = cy - keyH / 2 - w * 0.06;

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.roundRect(keyX, keyY, keyW, keyH, keyH / 2);
      ctx.fill();

      // 钥匙齿
      var toothW = w * 0.06;
      var toothH = w * 0.08;
      ctx.fillStyle = '#fff';
      ctx.fillRect(keyX + keyW - toothW * 0.8, keyY + keyH, toothW, toothH);
      ctx.fillRect(keyX + keyW - toothW * 2.2, keyY + keyH, toothW, toothH * 0.7);

      // 钥匙环
      ctx.beginPath();
      ctx.arc(keyX + keyW * 0.15, cy - w * 0.06, w * 0.08, 0, Math.PI * 2);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = Math.max(1.5, w * 0.06);
      ctx.stroke();

      // 下载箭头
      var arrowX = cx;
      var arrowY = cy + w * 0.14;
      var arrowSize = w * 0.1;

      ctx.strokeStyle = '#fff';
      ctx.lineWidth = Math.max(1.5, w * 0.05);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(arrowX, arrowY - arrowSize);
      ctx.lineTo(arrowX, arrowY + arrowSize * 0.6);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(arrowX - arrowSize * 0.7, arrowY);
      ctx.lineTo(arrowX, arrowY + arrowSize * 0.8);
      ctx.lineTo(arrowX + arrowSize * 0.7, arrowY);
      ctx.stroke();
    }

    /**
     * 下载 Canvas 内容为 PNG 文件
     * @param {HTMLCanvasElement} canvas
     * @param {string} filename
     */
    function downloadCanvas(canvas, filename) {
      canvas.toBlob(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    function downloadAll() {
      drawIcon(document.getElementById('c16'));
      drawIcon(document.getElementById('c48'));
      drawIcon(document.getElementById('c128'));
      setTimeout(function () {
        downloadCanvas(document.getElementById('c16'), 'icon16.png');
        downloadCanvas(document.getElementById('c48'), 'icon48.png');
        downloadCanvas(document.getElementById('c128'), 'icon128.png');
      }, 100);
    }

    drawIcon(document.getElementById('c16'));
    drawIcon(document.getElementById('c48'));
    drawIcon(document.getElementById('c128'));
  </script>
</body>
</html>
